<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETHUSDT Futures Live</title>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#060a13;color:#e8eef8;font-family:Arial,sans-serif}.app{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}h1{margin:0}.badge{color:#f0b90b}.muted{color:#77869b;font-size:13px}.live{color:#22c55e}.wait{color:#f59e0b}.bad{color:#ef4444}.price{font-size:30px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.card{background:#0d1421;border:1px solid #1e2a3e;border-radius:12px;padding:12px}.card span{color:#77869b;font-size:12px}.card b{display:block;margin-top:5px}.panel{background:#0a101b;border:1px solid #1e2a3e;border-radius:14px;overflow:hidden}.bar{display:flex;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #172235;flex-wrap:wrap}.btns{display:flex;gap:6px;flex-wrap:wrap}.btn{background:#101b2c;color:#aab7c9;border:1px solid #26364e;border-radius:8px;padding:8px 10px;cursor:pointer}.btn.active{background:#f0b90b;color:#07111f;border-color:#f0b90b;font-weight:800}.ohlc{display:flex;gap:10px;color:#77869b;font-size:12px;flex-wrap:wrap}.ohlc b{color:#d7e0ec}#chart{height:68vh;min-height:460px}.footer{padding:8px 10px;color:#6f7d90;font-size:11px;border-top:1px solid #172235;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pos{color:#22c55e}.neg{color:#ef4444}.error{padding:10px 12px;background:#261118;color:#fca5a5;font-size:12px;display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.app{padding:8px}#chart{min-height:500px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>ETHUSDT <span class="badge">Futures</span></h1><div class="muted">Binance USDⓈ-M · <span id="status" class="wait">Подключение...</span></div></div>
    <div><div class="muted">Текущая цена</div><div id="price" class="price">—</div><div id="change">—</div></div>
  </div>
  <div class="stats">
    <div class="card"><span>24ч максимум</span><b id="high">—</b></div>
    <div class="card"><span>24ч минимум</span><b id="low">—</b></div>
    <div class="card"><span>Объём 24ч</span><b id="vol">—</b></div>
    <div class="card"><span>Таймфрейм</span><b id="tf">5m</b></div>
  </div>
  <div class="panel">
    <div class="bar">
      <div class="btns">
        <button class="btn active" data-tf="5m">5m</button><button class="btn" data-tf="15m">15m</button><button class="btn" data-tf="30m">30m</button><button class="btn" data-tf="1h">1h</button><button class="btn" data-tf="4h">4h</button><button class="btn" data-tf="1d">1d</button>
      </div>
      <div class="ohlc"><span>O <b id="o">—</b></span><span>H <b id="h">—</b></span><span>L <b id="l">—</b></span><span>C <b id="c">—</b></span></div>
    </div>
    <div id="error" class="error"></div>
    <div id="chart"></div>
    <div class="footer"><span>Источник: Binance Futures</span><span id="updated">Обновление: —</span></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const REST='https://fapi.binance.com';
const WS='wss://fstream.binance.com/stream?streams=ethusdt@kline_5m/ethusdt@kline_15m/ethusdt@kline_30m/ethusdt@kline_1h/ethusdt@kline_4h/ethusdt@kline_1d/ethusdt@ticker';
let active='5m',socket=null,reconnectTimer=null,received=false;
const chart=LightweightCharts.createChart($('chart'),{autoSize:true,layout:{background:{type:LightweightCharts.ColorType.Solid,color:'#0a101b'},textColor:'#8796aa'},grid:{vertLines:{color:'#142033'},horzLines:{color:'#142033'}},rightPriceScale:{borderColor:'#26354a'},timeScale:{borderColor:'#26354a',timeVisible:true,secondsVisible:false,rightOffset:6}});
const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#22c55e',downColor:'#ef4444',borderUpColor:'#22c55e',borderDownColor:'#ef4444',wickUpColor:'#22c55e',wickDownColor:'#ef4444',priceFormat:{type:'price',precision:2,minMove:.01}});
const volumes=chart.addSeries(LightweightCharts.HistogramSeries,{priceScaleId:'volume',priceFormat:{type:'volume'},lastValueVisible:false,priceLineVisible:false});
chart.priceScale('volume').applyOptions({scaleMargins:{top:.82,bottom:0},borderVisible:false});
function fmt(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function compact(v){const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n):'—'}
function color(o,c){return Number(c)>=Number(o)?'rgba(34,197,94,.42)':'rgba(239,68,68,.42)'}
function status(text,cls){$('status').textContent=text;$('status').className=cls}
function error(text){$('error').textContent=text;$('error').style.display=text?'block':'none'}
function ohlc(k){$('o').textContent=fmt(k.o??k.open);$('h').textContent=fmt(k.h??k.high);$('l').textContent=fmt(k.l??k.low);$('c').textContent=fmt(k.c??k.close)}
function ticker(d){const ch=Number(d.P??d.priceChangePercent);$('price').textContent=fmt(d.c??d.lastPrice);$('high').textContent=fmt(d.h??d.highPrice);$('low').textContent=fmt(d.l??d.lowPrice);$('vol').textContent=compact(d.q??d.quoteVolume)+' USDT';if(Number.isFinite(ch)){$('change').textContent=(ch>0?'+':'')+ch.toFixed(2)+'%';$('change').className=ch>=0?'pos':'neg'}}
async function history(tf){try{error('');const r=await fetch(REST+'/fapi/v1/klines?symbol=ETHUSDT&interval='+tf+'&limit=500',{cache:'no-store'});const a=await r.json();if(!r.ok||!Array.isArray(a))throw new Error();const c=a.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));const v=a.map(k=>({time:Math.floor(k[0]/1000),value:+k[5],color:color(k[1],k[4])}));candles.setData(c);volumes.setData(v);if(c.length){$('price').textContent=fmt(c.at(-1).close);ohlc(c.at(-1))}chart.timeScale().fitContent()}catch(e){error('Не удалось загрузить историю Binance. Проверь, открывается ли Binance в этом браузере.')}}
async function snapshot(){try{const r=await fetch(REST+'/fapi/v1/ticker/24hr?symbol=ETHUSDT',{cache:'no-store'});const d=await r.json();if(r.ok&&d.lastPrice!==undefined)ticker(d)}catch(e){}}
function connect(){clearTimeout(reconnectTimer);if(socket){try{socket.close()}catch(e){}}status('Подключение...','wait');socket=new WebSocket(WS);socket.onopen=()=>status('Соединение...','wait');socket.onmessage=e=>{try{const m=JSON.parse(e.data),s=m.stream,d=m.data;if(!s||!d)return;received=true;status('LIVE','live');if(s.endsWith('@ticker')){ticker(d);$('updated').textContent='Обновление: '+new Date().toLocaleTimeString('ru-RU');return}if(s.includes('@kline_')&&d.k&&d.k.i===active){const k=d.k,c={time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c};candles.update(c);volumes.update({time:c.time,value:+k.v,color:color(k.o,k.c)});$('price').textContent=fmt(c.close);ohlc(k);$('updated').textContent='Обновление: '+new Date().toLocaleTimeString('ru-RU')}}catch(e){}};socket.onerror=()=>status('Ошибка Binance','bad');socket.onclose=()=>{status('Переподключение...','wait');reconnectTimer=setTimeout(connect,1500)}}
document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{active=b.dataset.tf;$('tf').textContent=active;document.querySelectorAll('.btn').forEach(x=>x.classList.toggle('active',x===b));history(active)});
snapshot();history(active);connect();setTimeout(()=>{if(!received)status('Нет данных Binance','bad')},8000);
</script>
</body>
</html>
